# baseURL = "https://example.com/"
baseURL = "https://www.zhumengyao.com/"
# languageCode = "en-us"
title = "Zhu Mengyao | AI · Math · Science"
theme = "scidraft"
enableRobotsTXT = true

# Required for the search page: Hugo does not inherit [outputs] from a theme.
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Required for math in note bodies: preserve the \( \) and $$ $$ delimiters
# through Markdown for KaTeX auto-render. Hugo does not merge [markup] from a theme.
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\[', '\]']]
        inline = [['\(', '\)'], ['$', '$']]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
  [markup.highlight]
    noClasses = false

[taxonomies]
  tag = "tags"


[pagination]
  pagerSize = 8

[params]
  mainSections = ["notes"]
  math = true
  recommendationCount = 3

  # Identity shown on every note card unless the note sets its own.
  institute = "zhumengyao.com"
  author = "zhumengyao"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowToc = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRelatedPosts = true


